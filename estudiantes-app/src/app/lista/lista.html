<div class="container mt-5">
  <h1 class="text-center mb-4">Reporte de Estudiantes</h1>

  <table class="table table-striped table-hover text-center align-middle shadow-sm">
    <thead class="table-primary">
      <tr>
        <th>Nombre</th>
        <th>Nota 1</th>
        <th>Nota 2</th>
        <th>Nota 3</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      @for (e of estudiantes; track e.id) {
        <tr>
          <td>{{ e.nombre }}</td>
          <td>{{ e.nota1 }}</td>
          <td>{{ e.nota2 }}</td>
          <td>{{ e.nota3 }}</td>
          <td>
            <a class="btn btn-primary btn-sm" [routerLink]="['/detalle', e.id]">Detalle</a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
